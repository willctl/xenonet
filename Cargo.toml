# XenoNet's Rust core (docs/design/rust-core.md). Electron and the console
# page are JS; everything else is here, a crate per layer.
[workspace]
resolver = "3"
members = ["crates/*", "adapters/*"]
# Xenolith's crates join once its own workspace folds into this one.
exclude = ["xenolith"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["willctl"]
repository = "https://github.com/willctl/xenonet"
publish = false

[workspace.dependencies]
xenonet-actors = { path = "crates/xenonet-actors" }
# The formats XenoNet writes: JSON, text, times, units, orderings.
xenonet-text = { path = "crates/xenonet-text" }
xenonet-blocks = { path = "crates/xenonet-blocks" }
xenonet-engine = { path = "crates/xenonet-engine" }
xenonet-schema = { path = "crates/xenonet-schema" }
xenonet-sources = { path = "crates/xenonet-sources" }
xenonet-state = { path = "crates/xenonet-state" }
# The install, assistant, integrations and doctor.
xenonet-components = { path = "crates/xenonet-components" }
xenonet-assistant = { path = "crates/xenonet-assistant" }
xenonet-integrations = { path = "crates/xenonet-integrations" }
xenonet-doctor = { path = "crates/xenonet-doctor" }
# The demo's made-up world, and what only the console has.
xenonet-demo = { path = "crates/xenonet-demo" }
xenonet-console = { path = "crates/xenonet-console" }
# JS keeps an object's keys in the order they were added, and so do the
# files and answers XenoNet writes: preserve_order keeps that order here.
serde_json = { version = "1", features = ["preserve_order"] }
# The data model's types (crates/xenonet-model), from which the JSON Schemas
# in schemas/ are written: serde for the data, schemars for the schemas.
serde = { version = "1", features = ["derive"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
xenonet-model = { path = "crates/xenonet-model" }
# Names the field a document fails at, which serde's own errors don't.
serde_path_to_error = "0.1"
xenonet-adapter = { path = "crates/xenonet-adapter" }
# What the adapters watch (xenonet_adapter::watch): FSEvents, inotify,
# ReadDirectoryChangesW and kqueue behind one API, so sessions and repos are
# pushed, not polled. CC0-1.0 (deny.toml says why that's allowed).
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# The adapters (adapters/*): one crate per platform, and all of them.
xenonet-claude-code = { path = "adapters/claude-code" }
xenonet-codex = { path = "adapters/codex" }
xenonet-grok-build = { path = "adapters/grok-build" }
xenonet-opencode = { path = "adapters/opencode" }
xenonet-cursor = { path = "adapters/cursor" }
xenonet-gemini-cli = { path = "adapters/gemini-cli" }
xenonet-copilot = { path = "adapters/copilot" }
xenonet-hermes = { path = "adapters/hermes" }
xenonet-grok-bot = { path = "adapters/grok-bot" }
xenonet-muse = { path = "adapters/muse" }
xenonet-platforms = { path = "adapters/all" }
# ACP's SDK, for the generic ACP client (adapters/acp): v1 only, pinned
# exactly, since its majors move in weeks.
agent-client-protocol = "=5.2.0"
# ACP's connection runs over a futures Sink and Stream (in the lock already
# through it).
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
xenonet-git = { path = "adapters/git" }
# A2A 1.0's types (a2aproject/a2a-rs, Apache-2.0): the Agent Card, messages,
# tasks, stream events and error codes, for A2A in at the front door and A2A
# out to other agents. The types alone: not a2a-client-lf, which brings
# gRPC and a prebuilt protoc. 0.x, so pinned exactly.
a2a-lf = "=0.4.2"
# Where the JS matches with a regular expression that has no lookaround
# (the log's key patterns); lookarounds are written out by hand.
regex = "1"
# engine.sqlite and search.sqlite. Bundled, so FTS5 and VACUUM INTO are
# there whatever SQLite the system has.
rusqlite = { version = "0.41", features = ["bundled"] }
# Names are compared after NFKC and NFD (core/actors/names.js), which std
# doesn't do.
unicode-normalization = "0.1"
# Tokens: a SHA-256 of each is all XenoNet keeps, and 32 random bytes from
# the system make one.
sha2 = "0.10"
getrandom = "0.3"
# The local time zone, as JS's dates read it, on unix; and O_NOFOLLOW as
# each system defines it, for reading a review's files without following
# a link.
libc = "0.2"
# Windows's job objects, so a headless turn and every process it starts
# (cmd.exe, then the node it runs) stop together. tokio already brings it.
windows-sys = "0.61"
# Zstandard, read only: Codex's archived rollouts (.jsonl.zst), which
# stats, search and a thread's transcript read as the JS does with
# zlib.zstdDecompressSync. A decoder in Rust alone, so the Windows and
# Linux builds need no C compiler for it; its one dependency, twox-hash,
# checks each frame's checksum.
ruzstd = "0.9"
# Gzip: the refusals' context, kept as zlib.gzipSync wrote it, and the
# component packages (.tar.gz), which the components crate reads itself so
# every entry is checked before anything is written.
flate2 = "1"
# URLs as `new URL()` reads and writes them (the WHATWG URL Standard), for
# what the JS checks, cleans or builds with Node's URL.
url = "2"
# String.prototype.normalize("NFC"), for the assistant's labels: already
# in the lock through url's idna.
icu_normalizer = "2.1"
xenonet-mcp = { path = "crates/xenonet-mcp" }
# The typed protocol between the service and its cores' drivers.
xenonet-api = { path = "crates/xenonet-api" }
# The system as XenoNet reads it: home, platform, random ids, fetch, lines.
xenonet-os = { path = "crates/xenonet-os" }
xenonet-service = { path = "crates/xenonet-service" }
# The local HTTP API and its event stream, over xenonet-api alone.
xenonet-http = { path = "crates/xenonet-http" }
# The binary's processes: the service's sockets, timers and children, its
# HTTP API (hyper, with XenoNet's own router on top), and the MCP servers
# (rmcp, which needs Rust 1.88: rust-toolchain.toml pins the checkout's).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "time", "sync", "process", "signal", "fs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
# The service's cores are traits the routes call through, async where the
# JS awaits (crates/xenonet-service/src/cores).
async-trait = "0.1"
# The engine running on this machine: its runtime, delivery, the network
# and the actors' sides.
xenonet-runtime = { path = "crates/xenonet-runtime" }
# fetch(), in the binary: HTTPS to the APIs XenoNet calls (Spotify,
# OpenRouter, Anthropic's usage, webhooks, updates), with rustls on ring
# and the system's own certificates, and the system's proxy.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# One network across machines (docs/design/network.md): a host's keys, its
# signed and sealed frames, the roster, the gateway's routes and the link.
xenonet-net = { path = "crates/xenonet-net" }
xenonet-id = { path = "crates/xenonet-id" }
# Signed hash chains and their policies: the network's roster, a person's
# device keys.
xenonet-log = { path = "crates/xenonet-log" }
# Who may do what, decided at the receiver.
xenonet-authz = { path = "crates/xenonet-authz" }
# The one store, <state>/xenonet.sqlite.
xenonet-store = { path = "crates/xenonet-store" }
# The machine's own keys (the Secure Enclave, polkit), for the composition
# root alone, and fakes of them.
xenonet-keys = { path = "crates/xenonet-keys" }
# Authority as Biscuit tokens (xenonet-authz): offline attenuation and a
# Datalog authorizer. No PEM or full regex; 6.0.0 doesn't build without
# its datalog-macro feature.
biscuit-auth = { version = "6", default-features = false, features = ["datalog-macro"] }
# The network's Ed25519 signatures, HKDF-SHA256, ChaCha20-Poly1305, HMAC
# and SHA-256: ring, which rustls already builds on.
ring = "0.17"
# X25519 with a key kept on disk, which ring's agreement can't load (it's
# ephemeral only): pure Rust, no C.
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
# The transport between machines (docs/design/network.md): QUIC with hole
# punching, relays the person names and address lookup, the endpoint id
# being host.key's Ed25519 key. TLS on ring, as rustls is here. Left out
# with the defaults: portmapper (UPnP/NAT-PMP asks the router to open a
# port, which the person hasn't chosen), metrics, and fast-apple-datapath,
# which sends and receives UDP in batches through Apple's private
# sendmsg_x/recvmsg_x calls: undocumented, so free to change or go in any
# macOS release, and the plain path is fast enough for XenoNet's traffic.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
# Finds the other members on the LAN, behind a machine setting asked at
# the first network setup. 0.x, so pinned exactly: a minor release may
# break it.
iroh-mdns-address-lookup = "=0.6.1"
# A simulated network for the transport's tests (MIT): hosts, partitions,
# loss and latency, on one seeded clock. A dev-dependency only, so it never
# ships.
turmoil = "0.7.2"
# base64url for the network's keys, signatures and sealed bodies (in the
# lock already through reqwest).
base64 = "0.23"

[profile.release]
lto = "thin"
codegen-units = 4

# What a published binary is built with (scripts/rust-release.mjs): the
# whole program optimized as one unit, with no debug info or symbol table.
# Measured against `release` on the same Mac, the service came out about a
# third smaller (34.5 MB to 22.1 MB) and 5-10% quicker to scan and search,
# for a build about three times as long, so local release builds stay on
# `release`. Panic messages keep their file and line
# without symbols.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
strip = "symbols"

# What the compiler and clippy hold the Rust core to (docs/design/rust-core.md,
# "Static analysis"). Each crate takes these with `[lints] workspace = true`,
# and CI fails on any warning. Code that needs an exception says why where it
# makes it, with #[expect(lint, reason = "...")].
[workspace.lints.rust]
# unsafe only where a crate or module says why: a libc call, an OS call.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
# Kani's model-checking proofs sit under #[cfg(kani)] (xenonet-id's hlc).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
# The default groups (correctness, suspicious, style, complexity, perf) and
# pedantic, less the pedantic checks below that are taste rather than bugs.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
items_after_statements = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
unreadable_literal = "allow"
single_match_else = "allow"
if_not_else = "allow"
match_same_arms = "allow"
implicit_hasher = "allow"
# The port computes as the JS does: numbers are f64, compared exactly and
# cast where JS truncates, on purpose.
float_cmp = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# The service runs for days, so nothing a person or a file can reach may
# panic it. expect stays for a real invariant, with the reason as its
# message. Tests may do all of these (clippy.toml).
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# stdout is the MCP servers' protocol and the command's output, so nothing
# else prints there. stderr is the log.
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
# #[expect] rather than #[allow], so an exception no longer needed shows,
# and each one says why.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
