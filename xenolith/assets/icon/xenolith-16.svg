<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Xenolith at 16 px (the tray at 100% scaling): the standing stone, its diamond and a
       block at each foot, fitted to the pixel grid. The badge sits in the top-right corner with
       a 1 px knocked-out ring. Same classes as xenolith.svg; scripts/build-icons.mjs renders
       the states. -->
  <defs>
    <mask id="knockout">
      <rect width="16" height="16" fill="#FFFFFF"/>
      <circle class="knockout" cx="12.5" cy="3.5" r="4.5" fill="#000000"/>
    </mask>
  </defs>
  <g class="glyph">
    <rect class="tile" fill="#39FF9F" x="5" y="1" width="6" height="14"/>
    <rect class="tile" fill="#39FF9F" x="1" y="12" width="3" height="3"/>
    <rect class="tile" fill="#39FF9F" x="12" y="12" width="3" height="3"/>
    <path class="accent" fill="#05070A" d="M8 4 L10 6 L8 8 L6 6 Z"/>
  </g>
  <g class="badge" display="none">
    <circle class="badge-dot" cx="12.5" cy="3.5" r="3.5" fill="#FFB547"/>
  </g>
</svg>
