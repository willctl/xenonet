<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Xenolith: three layers of stone, widest at the base, in the square style of XenoNet's
       mark. Drawn straight on the taskbar with no tile, for 20 px and up (xenolith-16.svg is the
       pixel-fitted tray version). scripts/build-icons.mjs colors class="tile" per state, and
       shows class="badge" when the state has one; class="knockout" erases a ring around the
       badge. -->
  <defs>
    <mask id="knockout">
      <rect width="256" height="256" fill="#FFFFFF"/>
      <circle class="knockout" cx="208" cy="48" r="56" fill="#000000"/>
    </mask>
  </defs>
  <g class="glyph">
    <rect class="tile" fill="#39FF9F" x="88" y="40" width="80" height="48"/>
    <rect class="tile" fill="#39FF9F" x="56" y="104" width="144" height="48"/>
    <rect class="tile" fill="#39FF9F" x="24" y="168" width="208" height="48"/>
  </g>
  <g class="badge" display="none">
    <circle class="badge-dot" cx="208" cy="48" r="40" fill="#FFB547"/>
  </g>
</svg>
