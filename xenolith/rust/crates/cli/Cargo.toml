[package]
name = "xenolith-cli"
description = "xenolith: the stdio MCP server, the session hook, the commands and the installer, on xenolith-core alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xenolith"
path = "src/main.rs"

# The hook starts this program for every conversation, so it takes the core and the MCP server only:
# never xenolith-net, which brings iroh and tokio. The service is xenolith-service (crates/service).
[dependencies]
xenolith-core.workspace = true
xenolith-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization"] }

[build-dependencies]
embed-resource = "3"
