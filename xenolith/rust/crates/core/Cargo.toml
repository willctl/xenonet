[package]
name = "xenolith-core"
description = "Xenolith's storage: paths, pages, index, log, search, inbox, locks, request log, secret guard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
fancy-regex.workspace = true
sha2.workspace = true
chrono.workspace = true
getrandom.workspace = true
x25519-dalek.workspace = true
unicode-normalization.workspace = true
# XenoNet's libraries: keys and signatures, signed chains and feeds, and who may do what. None of
# them brings tokio, reqwest, rustls or iroh, so neither does the core, the hook or the tray.
xenonet-id.workspace = true
xenonet-log.workspace = true
xenonet-authz.workspace = true
# Files only their owner may read, from the moment they exist (private_file).
xenonet-os.workspace = true
# What a space is about (EntityRef) and the ids it's bound to (chains.rs).
xenonet-model.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials"] }
