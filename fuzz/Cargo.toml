# Fuzz targets for XenoNet's readers of untrusted input (see "Fuzzing" in
# docs/guide/development.md). libFuzzer needs a nightly Rust, so this crate
# is its own workspace: the checkout's pinned toolchain, cargo deny and
# cargo shear never see it.
[package]
name = "xenonet-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

# libfuzzer-sys is the only crate the workspace doesn't have already;
# async-trait and tokio are for the service's routes and its stand-in cores.
# The network's targets run xenonet-net's nodes and gateway, and the
# engine's runtime (xenonet-runtime) for the bodies other hosts send.
[dependencies]
async-trait = "0.1"
libfuzzer-sys = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
xenonet-actors = { path = "../crates/xenonet-actors" }
xenonet-api = { path = "../crates/xenonet-api" }
xenonet-console = { path = "../crates/xenonet-console" }
xenonet-assistant = { path = "../crates/xenonet-assistant" }
xenonet-adapter = { path = "../crates/xenonet-adapter" }
xenonet-claude-code = { path = "../adapters/claude-code" }
xenonet-codex = { path = "../adapters/codex" }
xenonet-copilot = { path = "../adapters/copilot" }
xenonet-cursor = { path = "../adapters/cursor" }
xenonet-gemini-cli = { path = "../adapters/gemini-cli" }
xenonet-opencode = { path = "../adapters/opencode" }
xenonet-platforms = { path = "../adapters/all" }
xenonet-os = { path = "../crates/xenonet-os" }
xenonet-text = { path = "../crates/xenonet-text" }
xenonet-blocks = { path = "../crates/xenonet-blocks" }
xenonet-components = { path = "../crates/xenonet-components" }
xenonet-engine = { path = "../crates/xenonet-engine" }
xenonet-store = { path = "../crates/xenonet-store" }
xenonet-model = { path = "../crates/xenonet-model" }
xenonet-integrations = { path = "../crates/xenonet-integrations" }
xenonet-net = { path = "../crates/xenonet-net" }
# The roster's owner and their devices' presence, for the network targets.
xenonet-id = { path = "../crates/xenonet-id" }
xenonet-log = { path = "../crates/xenonet-log" }
xenonet-authz = { path = "../crates/xenonet-authz" }
xenonet-schema = { path = "../crates/xenonet-schema" }
xenonet-service = { path = "../crates/xenonet-service" }
xenonet-sources = { path = "../crates/xenonet-sources" }
xenonet-state = { path = "../crates/xenonet-state" }
xenonet-runtime = { path = "../crates/xenonet-runtime" }

