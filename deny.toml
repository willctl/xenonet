# What `cargo deny check` holds the Rust core's dependencies to
# (docs/design/rust-core.md, "Static analysis"): known advisories, licenses
# that fit XenoNet's MIT, no wildcards, and crates only from crates.io.
[graph]
# The platforms XenoNet ships for.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
# Every RustSec advisory fails the check: vulnerable, unsound, unmaintained
# or yanked. An exception goes in `ignore` with its reason.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
  # crypto-bigint 0.5's constant-time bugs, through p256, which biscuit-auth
  # always depends on. XenoNet holds no P-256 secret in biscuit: token roots
  # and appended blocks are Ed25519, so p256 only verifies public data.
  { id = "RUSTSEC-2026-0387", reason = "p256 in biscuit-auth only verifies public data here" },
  # proc-macro-error2 is unmaintained; biscuit-auth 6.0.0 needs its
  # datalog-macro feature to build at all, and the macro runs at build time.
  { id = "RUSTSEC-2026-0173", reason = "a build-time proc macro biscuit-auth 6.0.0 can't build without" },
  # paste is unmaintained (archived, no known bug); netlink-packet-core
  # 0.8 uses it, through netwatch (iroh's view of the network interfaces
  # on Linux), and the macro runs at build time.
  { id = "RUSTSEC-2024-0436", reason = "a build-time macro under iroh's netwatch, archived with no known bug" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # subtle, which rustls (the service's HTTPS client) uses for its
  # constant-time comparisons.
  "BSD-3-Clause",
]

# A licence the list above doesn't allow, for one crate alone, with why.
# Another crate under the same licence fails the check until it's added
# here with its own reason.
[[licenses.exceptions]]
# notify, the file watcher the adapters push sessions' changes from
# (FSEvents, inotify, ReadDirectoryChangesW behind one API), which no
# crate under the licenses above does across all three. CC0 is a public
# domain dedication with a fallback licence that asks less than MIT, so
# it fits XenoNet's MIT.
crate = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
# webpki-roots, Mozilla's root certificates as data, which iroh-relay
# always builds in to check a relay's TLS certificate (not optional
# there). CDLA-Permissive-2.0 is a data licence: share the data freely,
# keep its notice, no conditions on the code that uses it. That fits
# XenoNet's MIT.
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
# spez, a small macro crate n0-error (iroh's errors) builds on.
# BSD-2-Clause asks for the notice to be kept, as MIT does, and less than
# the BSD-3-Clause allowed above.
crate = "spez"
allow = ["BSD-2-Clause"]

[licenses.private]
# XenoNet's own crates aren't published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
