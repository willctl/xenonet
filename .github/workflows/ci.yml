name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
# One run per branch at a time. A new push to a pull request cancels the run
# its last push started, so fewer jobs wait in the macOS queue. Runs on main
# and on release tags are never cancelled.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The macOS tray (tray/macos): its build and its tests, which decode
      # the fixtures the JS and Rust tests check against the tray's schemas.
      # Only where there's a Swift toolchain; Linux and Windows have no tray.
      - name: Tray
        if: runner.os == 'macOS'
        run: |
          if xcrun --find swift > /dev/null 2>&1; then
            swift build --package-path tray/macos
            swift test --package-path tray/macos
          else
            echo "No Swift toolchain on this runner, so the tray isn't built."
          fi
  # The Rust core (docs/design/rust-core.md) on each platform: clippy, which
  # sees each platform's own code only there, its own tests, the JS tests
  # with each twin loaded, and the JS tests that start the service, the
  # command and the MCP servers against the xenonet binary. Debug builds, so
  # the addon and the binary reuse what cargo test compiled.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # The toolchain rust-toolchain.toml pins, with clippy and rustfmt.
      - run: rustup toolchain install
      - run: npm ci
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every crate's tests, so one run shows every failure.
      - run: cargo test --workspace --locked --no-fail-fast
      - run: npm run rust:build -- --debug
      - run: npm run test:rust
      # The service serves the built page, which one route test asks for.
      - run: npm run build
      - run: npm run test:bin
  # What doesn't depend on the platform, once: formatting, docs, advisories,
  # licenses, bans, sources and unused dependencies (npm run lint:rust).
  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: rustup toolchain install
      - run: cargo install --locked cargo-deny@0.20.2 cargo-shear@1.14.0
      - run: npm run lint:rust
  updates:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Desktop runs the xenonet binary, so it's built first.
      - run: rustup toolchain install
      - run: npm ci
      - run: npm run build
      - run: npm run rust:bin
      - run: node scripts/ci-desktop.mjs test/e2e/updates.test.js test/e2e/components.test.js
  # Desktop's end-to-end tests (test/e2e), all of them, on Linux: Electron on
  # a virtual display (Xvfb) with Chromium's software renderer, since the
  # runner has no GPU (docs/guide/development.md). Drawn in software, the
  # map makes a frame every second or two, so the suite takes the best part
  # of an hour, and its tests' time limits stretch (test/harness/software.js).
  # So it runs as four shards side by side, split by each file's time on
  # this runner (scripts/e2e-shard.mjs, test/e2e/timings.json), about ten
  # minutes each.
  e2e-linux:
    name: e2e-linux (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # The virtual display, the libraries Electron links that a bare Ubuntu
      # 24.04 lacks, and ffmpeg for the tests that record a film. The runner
      # image has most of them already.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth \
            libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libcups2t64 \
            libatk-bridge2.0-0t64 libxcomposite1 libxdamage1 ffmpeg
      # The registry and the debug build, keyed on the toolchain and the lock
      # file. A source change rebuilds only the crates it touches.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: e2e-linux-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: e2e-linux-cargo-
      - run: rustup toolchain install
      - run: npm ci
      # Electron fetches its binary on first use, and says so on stdout, so
      # it's fetched first and its path asked for after. Ubuntu 24.04's AppArmor
      # stops unprivileged programs from making the user namespaces
      # Chromium's sandbox runs in, so Electron aborts. This profile lets
      # the checkout's Electron, and nothing else, make them, and keeps the
      # sandbox on.
      - run: |
          node -e 'require("electron")' > /dev/null
          electron=$(realpath "$(node -p 'require("electron")')")
          sudo tee /etc/apparmor.d/xenonet-e2e-electron > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile xenonet-e2e-electron $electron flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/xenonet-e2e-electron
      - run: npm run build
      - run: npm run rust:bin
      # A screen that holds Desktop's 1600 by 960 window: Xvfb's default,
      # 1280 by 1024, narrows it and crowds the map.
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/ci-desktop.mjs
        env:
          XENONET_E2E_SHOW: inactive
          XENONET_SOFTWARE_RENDERING: "1"
          XENONET_E2E_SHARD: ${{ matrix.shard }}/4
      # A failing test saves what the window showed (the test instance's
      # made-up data only), and Desktop's log is beside it. Both are in
      # .xenonet, which the upload would otherwise pass over as hidden.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-linux-${{ matrix.shard }}
          path: |
            .xenonet/e2e-*.png
            .xenonet/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
