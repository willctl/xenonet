[package]
name = "xenonet-git"
description = "Git's adapter: what XenoNet knows of a checkout from git's own files (its root, its repo's key, its branch and head, worktree or main) and where to watch it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# A checkout's watch specs.
xenonet-adapter.workspace = true
# The repo key, normalized as project ids are made from it.
xenonet-model.workspace = true
# git run without a window, where the ref store isn't files.
xenonet-os.workspace = true

[lints]
workspace = true
