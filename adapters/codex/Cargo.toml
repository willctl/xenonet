[package]
name = "xenonet-codex"
description = "Codex's adapter: how XenoNet tells its processes apart, reaches its threads and connects it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The doctor's checks wait on the machine (which, exists, run).
async-trait.workspace = true
regex.workspace = true
# Codex desktop's state database, read-only.
rusqlite.workspace = true
serde_json.workspace = true
# The app-server is a child process on the service's runtime.
tokio.workspace = true
xenonet-adapter.workspace = true
xenonet-model.workspace = true
xenonet-os.workspace = true
xenonet-text.workspace = true
# The app-server client's lifecycle, for its block.
xenonet-blocks.workspace = true
# Codex's version from its user agent, and a rollout's line sampling.
xenonet-schema.workspace = true
xenonet-sources.workspace = true

[dev-dependencies]
# A rollout archived for the test.
ruzstd.workspace = true
xenonet-adapter = { workspace = true, features = ["testing"] }

[lints]
workspace = true
