[package]
name = "xenonet-net"
description = "One network across machines: a host's keys, signed and sealed frames, the roster chain, tickets, the gateway's routes and queues, a host's link to its gateway, and the transport between machines over iroh with its admission."
version.workspace = true
edition.workspace = true
# It runs on tokio beside the service, and iroh needs Rust 1.91.
rust-version = "1.91"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The transport between machines, and finding members on the LAN.
iroh.workspace = true
iroh-mdns-address-lookup.workspace = true
# The mDNS lookup's answers, as a stream, with unlisted relays taken out.
futures.workspace = true
ring.workspace = true
# svc: a published service on this machine, called on behalf of another.
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
x25519-dalek.workspace = true
xenonet-id.workspace = true
# The roster is its chain under the network policy.
xenonet-log.workspace = true
# Relayed reads and person entries are decided as every incoming act is.
xenonet-authz.workspace = true
xenonet-model.workspace = true
xenonet-os.workspace = true
xenonet-text.workspace = true

[dev-dependencies]
# Fake keys for the tests' person and devices: never the machine's own.
xenonet-keys.workspace = true
# The transport's simulated network (src/sim.rs).
turmoil.workspace = true
# A real self-hosted relay, with a test CA (src/relay_tests.rs).
iroh-relay.workspace = true
rcgen.workspace = true

[lints]
workspace = true
