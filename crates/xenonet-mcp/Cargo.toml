[package]
name = "xenonet-mcp"
description = "XenoNet's MCP servers, on rmcp: the engine's tools for sessions and actors, live messages for a Claude Code channel session, and the assistant's read-only tools."
version.workspace = true
edition.workspace = true
# rmcp needs Rust 1.88 or later (rust-toolchain.toml pins the checkout's).
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# `xenonet mcp` runs it; the binary of its own is for its stdio tests.
[[bin]]
name = "xenonet-mcp"
path = "src/main.rs"
test = false

[dependencies]
# The assistant's request ids (r_<uuid v4>) and its client's jitter.
getrandom.workspace = true
# The patterns the JS servers match with: the channel flags, tokens to
# withhold and the assistant's ids in its schemas.
regex.workspace = true
rmcp.workspace = true
serde_json.workspace = true
tokio.workspace = true
xenonet-actors.workspace = true
xenonet-base.workspace = true

# Whether a pid still runs (kill with signal 0), as process.kill(pid, 0).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
