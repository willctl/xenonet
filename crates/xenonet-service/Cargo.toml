[package]
name = "xenonet-service"
description = "The XenoNet service in Rust (xenonet serve): the HTTP API on 127.0.0.1, its event stream, the component service's socket, and the actor gateway."
version.workspace = true
edition.workspace = true
# It runs on tokio beside the MCP servers, in the one binary (Rust 1.88+).
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# `xenonet serve` runs it; the binary of its own is for its tests.
[[bin]]
name = "xenonet-service"
path = "src/main.rs"
test = false

[dependencies]
xenonet-console.workspace = true
async-trait.workspace = true
bytes.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# The terminal drawer's shells: a pty, ConPTY on Windows (server/terminals.js
# has node-pty).
portable-pty = "0.9"
reqwest.workspace = true
# A2A's task table, <state>/a2a.sqlite (a2a/store.rs).
rusqlite.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The core traits, settings and event sink it shares with the drivers.
xenonet-api.workspace = true
# Home, platform, random ids, fetch and output lines.
xenonet-os.workspace = true
# The adapters the binary runs with (adapters/*), put in place at start.
xenonet-platforms.workspace = true
xenonet-adapter.workspace = true
xenonet-actors.workspace = true
# The places around the map (core/environments.js).
xenonet-text.workspace = true
# The engine's ids, selectors and envelopes, which the routes check with.
xenonet-engine.workspace = true
# One network across machines: the gateway's routes behind the front door,
# the link, and /api/net.
xenonet-net.workspace = true
# The machine's own keys (the Secure Enclave, polkit) for the installed and
# dev instances, fakes for every other: given to the network's node as its
# vault (compose/keys.rs).
xenonet-keys.workspace = true
xenonet-id.workspace = true
# Every route's rule is decided through it (routes/rules.rs).
xenonet-authz.workspace = true
# Ids, and the engine's seam to the network; the tray's status and a
# made-up machine's load are checked as their types in the tests.
xenonet-model.workspace = true
xenonet-schema.workspace = true
# The Needs you queue as the console has it (core/needs-you.js's twin), for
# the tray's status (routes/tray.rs).
xenonet-state.workspace = true
# The composition's connect driver (compose/connect.rs): the runtime's
# files and processes, the setup it's made from, and XenoNet's install
# (the xenonet command the hooks run, the instances).
xenonet-runtime.workspace = true
xenonet-components.workspace = true
# The composition's other cores (compose/app.rs): hosts and the hub,
# remote actors' connections and tunnels, the integrations, the decision
# model, refusals and the doctor; and Grok Build's config.toml, which the
# MCP catalog reads through its adapter.
xenonet-assistant.workspace = true
xenonet-doctor.workspace = true
xenonet-grok-build.workspace = true
xenonet-hosts.workspace = true
xenonet-integrations.workspace = true
xenonet-sources.workspace = true

[dev-dependencies]
# Paused time, for the tunnel's waits between restarts.
tokio = { workspace = true, features = ["test-util"] }
# The network tests' person chain entries (a revocation, a new device).
xenonet-log.workspace = true

[lints]
workspace = true
