[package]
name = "xenonet-adapter"
description = "How a platform plugs into XenoNet: the Platform trait, the registry of apps and actor products, and the checks, hooks, readers and openers an adapter provides."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The doctor's checks wait on the machine (which, exists, run).
async-trait.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# A short, stable tag for a place in an observer's event refs.
sha2.workspace = true
# A lister that keeps a client running (Codex's app-server) runs it on the
# service's runtime.
tokio.workspace = true
xenonet-os.workspace = true
xenonet-text.workspace = true
# A lister's block reports its lifecycle.
xenonet-blocks.workspace = true
xenonet-model.workspace = true
# The system's file events, which the watchers push sessions' changes from.
notify.workspace = true
# Where a settings file that isn't JSON goes wrong, for connect's message.
xenonet-schema.workspace = true

[features]
# A fake machine for the adapters' connect tests.
testing = []

[lints]
workspace = true
