[package]
name = "xenonet-actors"
description = "Actors: the programs you allow in XenoNet, their tokens, and what they report; the cloud assistants' reads, credentials and tunnels; and the stores secrets are kept in (your credential store, or memory)."
version.workspace = true
edition.workspace = true
# The api, through xenonet-net, needs Rust 1.91.
rust-version = "1.91"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The cloud assistants' reads (assistant/service.rs) wait on their host.
async-trait.workspace = true
getrandom.workspace = true
# Labels in NFC, as the assistants' projection shows them.
icu_normalizer.workspace = true
regex.workspace = true
serde_json.workspace = true
# The credential store's program, run off the async threads.
tokio.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
xenonet-adapter.workspace = true
# Tokens' prefixes, and the actions their rights name.
xenonet-authz.workspace = true
# A grant's id as the assistants' credentials on disk are named
# (xenonet-api's `credentials`).
xenonet-api.workspace = true
xenonet-model.workspace = true
xenonet-os.workspace = true
xenonet-text.workspace = true

[lints]
workspace = true
