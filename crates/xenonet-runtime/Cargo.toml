[package]
name = "xenonet-runtime"
description = "The engine running on this machine: its runtime, the engine's and delivery's drivers, the network across machines, starts, asks and runs, the process checks, the store's sides, and the actors' sides (registration, wakes, reports, tokens, spend, observers)."
version.workspace = true
edition.workspace = true
# It drives the engine's cores on tokio (Rust 1.88+, as the service).
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The adapters in place (the binary installs them at start).
xenonet-adapter.workspace = true
xenonet-text.workspace = true
xenonet-api.workspace = true
# Home, platform, random ids, fetch and output lines.
xenonet-os.workspace = true
xenonet-actors.workspace = true
xenonet-blocks.workspace = true
xenonet-engine.workspace = true
rusqlite.workspace = true
# The checks on what an actor reports: its events and targets read as their
# types.
xenonet-schema.workspace = true
xenonet-model.workspace = true
# A webhook wake follows no redirect; the service's fetch does.
reqwest.workspace = true
# WHATWG URL parsing, for a webhook's URL.
url.workspace = true
# The token look's names, shown without the token.
regex.workspace = true
# Every act from another machine is decided here (xenonet-authz), on this
# machine's copy of the chains and the person on it (xenonet-net's
# governance), with the person's device signatures and presence
# (xenonet-id, xenonet-log).
xenonet-authz.workspace = true
xenonet-id.workspace = true
xenonet-log.workspace = true
xenonet-net.workspace = true

[dev-dependencies]
# Fake keys for the tests' person and devices: never the machine's own.
xenonet-keys.workspace = true
# The real adapters, which the tests install as the binary does at start.
xenonet-platforms.workspace = true
# The demo's world, which tests/actors.rs names its nodes from.
xenonet-demo.workspace = true

[lints]
workspace = true
