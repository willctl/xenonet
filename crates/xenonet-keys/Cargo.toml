[package]
name = "xenonet-keys"
description = "Where this machine's keys live and how it asks the person: the Secure Enclave signer and ECIES on macOS, the TPM signer and Windows Hello on Windows, polkit and a passphrase on Linux, file keys elsewhere, and fakes that never prompt. Only the composition root uses it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The passphrase fallback's PBKDF2 and its constant-time comparison.
ring.workspace = true
serde_json.workspace = true
xenonet-id.workspace = true
# pkcheck on the PATH.
xenonet-os.workspace = true

# The controlling terminal's echo, for the passphrase fallback (termios).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The Secure Enclave's keys, ECDSA and ECIES through Security.framework:
# the safe wrapper for making keys and using them, its -sys crate for
# SecKeyCreateWithData (which restores a key from its blob) and the key
# attributes, and Core Foundation's types to pass them. All three are in
# the lock already through rustls's platform verifier.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
security-framework-sys = { version = "2.17", default-features = false }
core-foundation = "0.10"

# Windows Hello's prompt (UserConsentVerifier), shown over the window the
# person is in through its interop interface, and windows-future for the
# operation it returns, which the interop call asks for by type; and
# NCrypt (Win32_Security_Cryptography) for the TPM's machine signing key.
# windows-core is in the lock already; these add the bindings used.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["std", "Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
