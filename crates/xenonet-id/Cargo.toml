[package]
name = "xenonet-id"
description = "Who signed what: Ed25519 keys and key ids, signatures bound to their purpose, the signers that hold a key, key stores, presence blocks that prove a person was there, did:key names, and a hybrid logical clock to order what several machines wrote. Usable alone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
# Ed25519 to sign and verify, ECDSA P-256 to verify a hardware key's
# signatures, SHA-256 and the system's random numbers.
ring.workspace = true
serde_json.workspace = true
x25519-dalek.workspace = true
# Owner-only files on Windows (the key files): private_file alone, so
# without fetch() and tokio, which Xenolith's hook and tray never take.
xenonet-os = { path = "../xenonet-os", default-features = false }

[dev-dependencies]
# Random clocks, steps and remote values for the HLC's properties.
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
