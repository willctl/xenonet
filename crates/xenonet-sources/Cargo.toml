[package]
name = "xenonet-sources"
description = "What XenoNet reads: the transcripts' lines and events, the records the readers make, and the other sources of the map; and the refusals XenoNet keeps, as the service's Refusals core."
version.workspace = true
edition.workspace = true
# iroh, through xenonet-net, needs Rust 1.91.
rust-version = "1.91"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flate2.workspace = true
getrandom.workspace = true
regex.workspace = true
# Codex's archived rollouts (.jsonl.zst), read whole.
ruzstd.workspace = true
serde_json.workspace = true
sha2.workspace = true
xenonet-adapter.workspace = true
xenonet-model.workspace = true
xenonet-os.workspace = true
xenonet-text.workspace = true
# A transcript's lines are sampled per file as they go through the
# normalizer (`lines::records`).
xenonet-schema.workspace = true
# The Refusals core it implements (refusals/runtime.rs).
xenonet-api.workspace = true

# The telemetry's tests read lines through the adapters' readers.

[dev-dependencies]
xenonet-platforms.workspace = true

[lints]
workspace = true
