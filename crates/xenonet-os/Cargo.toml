[package]
name = "xenonet-os"
description = "The machine XenoNet runs on: files, paths, processes and the children it runs, a thread for work that isn't Send, locks, the error log, its own folders, the home folder, platform and random ids, fetch(), a program's output lines, the programs that open things, the system panel's numbers and their reading, files followed on their own, and why something failed."
version.workspace = true
edition.workspace = true
# reqwest and tokio, as the service (Rust 1.88+).
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# crypto.randomUUID().
getrandom.workspace = true
# fetch() (net.rs): HTTPS with rustls on ring and the system's certificates.
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
# Lines of a program's output (lines.rs), the children fx.rs runs and the
# system panel's reading (system.rs).
tokio = { workspace = true, optional = true }
# A file followed on its own (follow.rs): notify's event types, on kqueue.
notify = { workspace = true, optional = true }
# The log's key patterns and what private_file reads of an ACL.
regex.workspace = true
serde_json.workspace = true
xenonet-text.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows's job objects, so a headless turn and every process it starts
# stop together (process.rs), and files made with their DACL from the start
# (private_file.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Both on by default, for XenoNet. A crate that needs only files, paths and
# private_file (xenonet-id, so Xenolith's hook and tray) turns them off and
# so takes no tokio, reqwest or rustls.
[features]
default = ["fetch", "process"]
# fetch() over HTTPS (net.rs).
fetch = ["dep:reqwest", "dep:rustls"]
# Programs run and read on tokio: fx.rs, lines.rs and system.rs.
process = ["dep:tokio"]
# Files followed on their own with kqueue on macOS, beside a folder's FSEvents
# watch (follow.rs).
follow = ["dep:notify"]

[lints]
workspace = true
