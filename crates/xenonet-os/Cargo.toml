[package]
name = "xenonet-os"
description = "The machine XenoNet runs on: files, paths, processes and the children it runs, a thread for work that isn't Send, locks, the error log, its own folders, the home folder, platform and random ids, fetch(), a program's output lines, the programs that open things, the system panel's numbers and their reading, and why something failed."
version.workspace = true
edition.workspace = true
# reqwest and tokio, as the service (Rust 1.88+).
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# crypto.randomUUID().
getrandom.workspace = true
# fetch() (net.rs): HTTPS with rustls on ring and the system's certificates.
reqwest.workspace = true
rustls.workspace = true
# Lines of a program's output (lines.rs).
tokio.workspace = true
# The log's key patterns and what private_file reads of an ACL.
regex.workspace = true
serde_json.workspace = true
xenonet-text.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows's job objects, so a headless turn and every process it starts
# stop together (process.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
