[package]
name = "xenonet-api"
description = "The typed local protocol between XenoNet's service and the drivers of its cores: the core traits, the service's settings, the event sink and what the drivers share."
version.workspace = true
edition.workspace = true
# The cores' traits are async on tokio, as the service (Rust 1.88+).
# iroh, through xenonet-net, needs Rust 1.91.
rust-version = "1.91"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
xenonet-model.workspace = true
# Where the API's credential file is (http.rs).
xenonet-os.workspace = true
xenonet-text.workspace = true
# The slot the network's sinks go in, which the hub and the engine's plug
# are given (cores/hosts.rs, cores/mod.rs).
xenonet-net.workspace = true
# The drift log and the vendor readers the drivers share (wire.rs).
xenonet-schema.workspace = true

[dev-dependencies]
# The token prefixes bearer.rs looks for are authz's, and the shapes
# credentials.rs tells are the actors' (tests hold them so).
xenonet-authz.workspace = true
xenonet-actors.workspace = true

[lints]
workspace = true
