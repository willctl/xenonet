[package]
name = "xenonet-wire-engine"
description = "The binary's drivers for the engine, delivery and actors, which the twins' JS drives during the port."
version.workspace = true
edition.workspace = true
# It drives the service's cores on tokio (Rust 1.88+, as the service).
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The adapters, put in place as the world is made.
xenonet-platforms.workspace = true
xenonet-adapter.workspace = true
xenonet-text.workspace = true
xenonet-api.workspace = true
# Home, platform, random ids, fetch and output lines.
xenonet-os.workspace = true
xenonet-actors.workspace = true
xenonet-blocks.workspace = true
xenonet-engine.workspace = true
rusqlite.workspace = true
# The checks on what an actor reports: its events and targets read as their
# types.
xenonet-schema.workspace = true
xenonet-model.workspace = true
# The demo's sessions by title, for its made-up actors' scripts.
xenonet-app.workspace = true
xenonet-components.workspace = true
# A webhook wake follows no redirect; the service's fetch does.
reqwest.workspace = true
# WHATWG URL parsing, for a webhook's URL, as the twin's new URL() read it.
url.workspace = true
# The token look's names, shown without the token.
regex.workspace = true
# The relay's scrubber, for the detail presence carries to other machines:
# the home folder as ~, as the relay writes it.
xenonet-hosts.workspace = true

[lints]
workspace = true
