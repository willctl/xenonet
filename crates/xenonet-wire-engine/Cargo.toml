[package]
name = "xenonet-wire-engine"
description = "The binary's drivers for the engine, delivery and actors, which the twins' JS drives during the port."
version.workspace = true
edition.workspace = true
# It drives the service's cores on tokio (Rust 1.88+, as the service).
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
xenonet-base.workspace = true
xenonet-service.workspace = true
xenonet-actors.workspace = true
xenonet-blocks.workspace = true
xenonet-engine.workspace = true
rusqlite.workspace = true
# The checks on what an actor reports, against the schema npm run schemas
# writes (ReportEvent, ReportTarget).
xenonet-schema.workspace = true
# The demo's sessions by title, for its made-up actors' scripts.
xenonet-app.workspace = true
xenonet-components.workspace = true
# A webhook wake follows no redirect; the service's fetch does.
reqwest.workspace = true
# WHATWG URL parsing, for a webhook's URL, as the twin's new URL() read it.
url.workspace = true
# The token look's names, shown without the token.
regex.workspace = true

# Whether a process still runs (kill with signal 0), without a command.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
