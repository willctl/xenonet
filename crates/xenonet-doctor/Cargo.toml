[package]
name = "xenonet-doctor"
description = "XenoNet's doctor: whether what XenoNet needs is in place, and how to fix it when it isn't. Each check's verdict and wording, the summary and what counts as a new problem; the diagnostics bundle; and the service's Doctor and Diagnostics cores over them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
xenonet-components.workspace = true
async-trait.workspace = true
regex.workspace = true
serde_json.workspace = true
xenonet-adapter.workspace = true
xenonet-os.workspace = true
xenonet-text.workspace = true
xenonet-schema.workspace = true
# The runtime (src/runtime.rs): the Doctor and Diagnostics cores over the
# other cores, the engine's process self-test, the network's
# checks, state.json read as its type, whether git needs the developer
# tools, and the checks' processes and timers.
tokio.workspace = true
xenonet-api.workspace = true
xenonet-engine.workspace = true
xenonet-net.workspace = true
xenonet-sources.workspace = true

# access(2), statvfs(3) and uname(2), which std doesn't wrap.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The tests check the apps' rows and commands, which their adapters bring.
[dev-dependencies]
xenonet-platforms.workspace = true

[lints]
workspace = true
