[package]
name = "xenonet-assistant"
description = "What remote actors (cloud assistants) may read of XenoNet: grant credentials on disk, page tokens, the projection of the map a grant sees, the six reads' checks and answers, the adapter's way to the service, and the tunnels XenoNet runs for them; and their runtime: the connections, reads, audit and tunnels as the service's cores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
icu_normalizer.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
xenonet-os.workspace = true
xenonet-text.workspace = true
xenonet-components.workspace = true
# Page cursors, which narrow an actor's grant (a Biscuit), and the grants
# held in memory for the made-up reads: decided as the service decides
# them, under a token root certified with a key held in memory.
xenonet-authz.workspace = true
xenonet-id.workspace = true
# The runtime (src/runtime): the cores it implements, the engine's store
# the grants are kept in, the actors' connections and limits, the
# products' names, the answers' types, your credential store for the
# tunnels' keys, and their processes and timers.
async-trait.workspace = true
tokio.workspace = true
xenonet-api.workspace = true
xenonet-engine.workspace = true
xenonet-actors.workspace = true
xenonet-adapter.workspace = true
xenonet-model.workspace = true
xenonet-schema.workspace = true

# os.hostname() and os.userInfo(), which a device's fingerprint is made of.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
